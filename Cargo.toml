[package]
name = "iptv-proxy"
version = "1.0.1"
edition = "2021"
authors = ["IPTV Proxy Team"]

[features]
default = ["server"]
# Pure rewriting/HTTP policy tests also run on Windows with --no-default-features.
server = ["dep:pingora", "dep:async-trait", "dep:log", "dep:env_logger"]

[[bin]]
name = "iptv-proxy"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
pingora = { git = "https://github.com/cloudflare/pingora", rev = "d9e6d7a", default-features = false, features = ["proxy", "rustls"], optional = true }
async-trait = { version = "0.1", optional = true }
bytes = "1"
url = "2"
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
http = "1"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3
